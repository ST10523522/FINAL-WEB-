<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart Checkout | The Bouyz Clothing</title>
<meta name="description" content="Your shopping cart - The Bouyz Clothing checkout via WhatsApp">
<link rel="stylesheet" href="css_assets/myfirststyle.css">
</head>
<body>

<header>
<img src="_images/logo.jpg" alt="Bouyz logo cart checkout">
<nav>
<a href="index.html">HOME</a>
<a href="shop.html">SHOP</a>
<a href="gallery.html">GALLERY</a>
<a href="cart.html">CART (<span id="cart-count">0</span>)</a>
</nav>
</header>

<div class="cart-page">
<h1>Your Shopping Cart</h1>
<br>

<div id="cart-items">
<p>Loading cart...</p>
</div>

<h3 id="cart-total" style="margin-top:20px; color:#ff3c3c;"></h3>

<br>
<button onclick="checkout()" class="btn btn-white" style="width:100%;">
Checkout via WhatsApp
</button>

<br><br>
<a href="shop.html" style="display:block; text-align:center; color:#aaa;">
Continue Shopping
</a>
</div>

<!-- Modal for checkout feedback -->
<div id="modal">
<div class="modal-content">
<p id="modal-text"></p>
<br>
<button class="btn btn-white" onclick="closeModal()">OK</button>
</div>
</div>

<footer>
<p>The Bouyz Clothing - Cart Page</p>
</footer>

<script src="js_assets/cart.js"></script>
<script src="js_assets/main.js"></script>

</body>
</html>
